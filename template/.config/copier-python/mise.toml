# Tools and tasks owned by the copier-python template; Renovate keeps these pins current
# in the template repo. Override only `check-extra` and `hooks-extra`, in .config/mise/config.toml.
min_version = "2026.7.2"

[env]
TY_CONFIG_FILE = "{{config_root}}/.config/copier-python/ty.toml"

[tools]
uv = "0.13.5"
ruff = "0.17.2"
ty = "0.0.91"
prek = "0.5.7"
"github:EtaCassiopeia/lid-tooling" = { version = "0.3.0", asset_pattern = "lidc-x86_64-unknown-linux-gnu" }
apm = "0.35.0"

# apm and the skills first, as the session hook does, so a tool that fails to install
# doesn't cost the repo its skills.
[tasks.setup]
run = [
  "mise install apm",
  "mise run skills",
  "mise install",
  "prek install -c .config/copier-python/prek.toml",
]

# Installs exactly the skills apm.lock.yaml records. Clearing first drops a skill a template
# update removed; APM's cache makes the reinstall quick and lets it work offline.
[tasks.skills]
dir = "{{config_root}}/.config/copier-python"
run = ["rm -rf .claude", "apm install --frozen"]

[tasks.sync]
run = "uv sync --locked --all-extras --all-groups"

[tasks.lint]
run = """
status=0
ruff check || status=1
ruff format --check || status=1
exit $status
"""

[tasks.typecheck]
depends = ["sync"]
run = "ty check"

[tasks.test]
depends = ["sync"]
run = "uv run --locked pytest"

[tasks.lid]
run = "lidc check --only reverse-orphan,coverage,spec-id-format --fail-on warning"

[tasks.conflicts]
run = """
status=0
git grep -nE '^(<<<<<<<|>>>>>>>) ' -- ':/' || status=$?
case $status in
  0) echo "conflict markers found" >&2; exit 1 ;;
  1) exit 0 ;;
  *) exit "$status" ;;
esac
"""

# copier never deletes a symlink, so a skill a template release removes leaves its links dangling.
# The template's links resolve only once the skills are installed, so install them first.
[tasks.skill-links]
depends = ["skills"]
run = """
status=0
for link in .claude/skills/* .claude/skills/.[!.]* .claude/skills/..?* \\
  .agents/skills/* .agents/skills/.[!.]* .agents/skills/..?*; do
  if [ -L "$link" ] && [ ! -e "$link" ]; then
    echo "dangling skill link: $link" >&2
    status=1
  fi
done
exit $status
"""

# Fails while the instruction file's `## LID` version differs from the one the lock file pins.
[tasks.lid-version]
run = "uv run --no-project .config/copier-python/lid_version.py"

[tasks.check-extra]
run = "true"

[tasks.hooks-extra]
run = "true"

[tasks.check]
depends = [
  "lint", "typecheck", "test", "lid", "conflicts", "skill-links", "lid-version", "check-extra",
]

[tasks.fix]
run = ["ruff check --fix", "ruff format"]

[tasks.hooks]
run = "prek run -c .config/copier-python/prek.toml --all-files"

[tasks.exceptions]
run = "uv run --no-project .config/copier-python/exceptions.py"
