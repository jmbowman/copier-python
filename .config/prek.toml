# Commit-time hooks for this repo, each running a mise task on the whole project.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "lint"
name = "lint"
entry = "mise run lint"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "typecheck"
name = "typecheck"
entry = "mise run typecheck"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "lid"
name = "lid"
entry = "mise run lid"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "conflicts"
name = "conflicts"
entry = "mise run conflicts"
language = "system"
pass_filenames = false
