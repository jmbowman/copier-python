# This repo's own tools and tasks, hand-written until the template applies itself here.
min_version = "2026.7.2"

[tools]
uv = "0.13.6"
ruff = "0.17.3"
ty = "0.0.95"
prek = "0.5.7"
"github:kjanat/actionlint" = "1.17.0"
"github:EtaCassiopeia/lid-tooling" = { version = "0.3.0", asset_pattern = "lidc-x86_64-unknown-linux-gnu" }
apm = "0.35.0"

[env]
TY_CONFIG_FILE = "{{config_root}}/.config/ty.toml"

[tasks.setup]
run = ["mise install", "mise run skills", "prek install -c .config/prek.toml"]

# Installs the LID skills apm.lock.yaml records into .claude/skills/, where they're gitignored.
[tasks.skills]
run = ["rm -rf .claude/skills", "apm install --frozen"]

# Installs the template's skills in template/, which fails if its manifest and lock file disagree.
[tasks.template-skills]
dir = "{{config_root}}/template/.config/copier-python"
run = ["rm -rf .claude", "apm install --frozen"]

[tasks.sync]
run = "uv sync --locked --all-extras --all-groups"

# Tests copy template/, so the template's install has to finish first.
[tasks.test]
depends = ["sync", "template-skills"]
run = "uv run --locked pytest"

[tasks.lid-version]
run = "uv run --no-project template/.config/copier-python/lid_version.py --lock apm.lock.yaml --instructions AGENTS.md"

[tasks.lint]
run = """
status=0
template_python="template/.config/copier-python/exceptions.py template/.config/copier-python/lid_version.py"
ruff check || status=1
ruff check --config .ruff.toml $template_python || status=1
ruff format --check || status=1
ruff format --check --config .ruff.toml $template_python || status=1
actionlint .github/workflows/*.yml || status=1
exit $status
"""

[tasks.typecheck]
depends = ["sync"]
run = "ty check"

[tasks.lid]
run = "lidc check --only reverse-orphan,coverage,spec-id-format --fail-on warning"

[tasks.conflicts]
run = """
status=0
git grep -nE '^(<<<<<<<|>>>>>>>) ' -- ':/' || status=$?
case $status in
  0) echo "conflict markers found" >&2; exit 1 ;;
  1) exit 0 ;;
  *) exit "$status" ;;
esac
"""

[tasks.fix]
run = ["ruff check --fix", "ruff format"]

[tasks.hooks]
run = "prek run -c .config/prek.toml --all-files"

[tasks.check]
depends = ["lint", "typecheck", "test", "lid", "conflicts", "lid-version"]
