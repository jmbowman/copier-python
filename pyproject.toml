[project]
name = "copier-python"
version = "0.0.0"
description = "Copier template for a strict Python repo baseline, with its tests"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["copier==9.19.1", "pytest==9.1.1", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]
addopts = "--strict-markers"
markers = [
    "network: needs network access (installing tools or packages, or reading other repos)",
    "slow: takes more than a few seconds",
]
