# This repo's own tools and tasks, hand-written until the template applies itself here.
min_version = "2026.7.2"

[tools]
uv = "0.13.1"
ruff = "0.17.1"
ty = "0.0.89"
prek = "0.5.6"
"github:kjanat/actionlint" = "1.17.0"
"github:EtaCassiopeia/lid-tooling" = { version = "0.3.0", asset_pattern = "lidc-x86_64-unknown-linux-gnu" }

[env]
TY_CONFIG_FILE = "{{config_root}}/.config/ty.toml"

[tasks.setup]
run = ["mise install", "prek install -c .config/prek.toml"]

[tasks.sync]
run = "uv sync --locked --all-extras --all-groups"

[tasks.test]
depends = ["sync"]
run = "uv run --locked pytest"

[tasks.lint]
run = """
status=0
template_python=template/.config/copier-python/exceptions.py
ruff check || status=1
ruff check --config .ruff.toml "$template_python" || status=1
ruff format --check || status=1
ruff format --check --config .ruff.toml "$template_python" || status=1
actionlint .github/workflows/*.yml || status=1
exit $status
"""

[tasks.typecheck]
depends = ["sync"]
run = "ty check"

[tasks.lid]
run = "lidc check --only reverse-orphan,coverage,spec-id-format --fail-on warning"

[tasks.conflicts]
run = """
status=0
git grep -nE '^(<<<<<<<|>>>>>>>) ' -- ':/' || status=$?
case $status in
  0) echo "conflict markers found" >&2; exit 1 ;;
  1) exit 0 ;;
  *) exit "$status" ;;
esac
"""

[tasks.fix]
run = ["ruff check --fix", "ruff format"]

[tasks.hooks]
run = "prek run -c .config/prek.toml --all-files"

[tasks.check]
depends = ["lint", "typecheck", "test", "lid", "conflicts"]
